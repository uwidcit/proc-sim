# EasyPanel Compose service (or local docker compose up --build)
# Set secrets in the EasyPanel Environment tab / .env (see .env.example)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procplat}
      POSTGRES_USER: ${POSTGRES_USER:-procplat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - procplat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ENV: ${ENV:-production}
      FLASK_APP: wsgi.py
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-procplat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-procplat}
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-procplat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-procplat}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - procplat_uploads:/app/App/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  procplat_pg:
  procplat_uploads:

# Optional Render Blueprint (EasyPanel is preferred for this project — see readme)
services:
  - type: web
    name: proc-plat
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py wsgi:app
    envVars:
      - key: ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: proc-plat-db
          property: connectionString

databases:
  - name: proc-plat-db
    plan: free

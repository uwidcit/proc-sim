<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Procurement Simulator{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  {% block head %}{% endblock %}
</head>
<body style="margin:0; font-family: var(--font-body); color: var(--ink); background: var(--paper);">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="toast-stack" id="toastStack" aria-live="polite">
    {% for category, message in messages %}
    <div class="toast {% if category == 'success' %}toast-ok{% elif category == 'failed' %}toast-fail{% else %}toast-info{% endif %}" data-toast>
      <span>{{ message }}</span>
      <button type="button" class="toast-dismiss" data-toast-dismiss aria-label="Dismiss">×</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script>
  (function () {
    function dismissToast(el) {
      if (!el || el.classList.contains('is-leaving')) return;
      el.classList.add('is-leaving');
      setTimeout(function () { el.remove(); }, 200);
    }
    document.querySelectorAll('[data-toast]').forEach(function (toast) {
      toast.querySelector('[data-toast-dismiss]')?.addEventListener('click', function () {
        dismissToast(toast);
      });
      setTimeout(function () { dismissToast(toast); }, 4200);
    });
  })();
  </script>
</body>
</html>
